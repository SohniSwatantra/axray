<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AXray lockup: dark card, agent-reading mark, AX(white)+ray(lime) wordmark -->
  <rect width="420" height="120" rx="16" fill="#101010"/>
  <!-- mark: lime rounded square -->
  <g transform="translate(36,24)">
    <rect width="72" height="72" rx="20" fill="#C6F24E"/>
    <!-- the content an agent reads -->
    <rect x="18" y="20.25" width="27" height="5.4" rx="2.7" fill="#0A0A0A"/>
    <rect x="18" y="31.5" width="33.75" height="5.4" rx="2.7" fill="#0A0A0A"/>
    <rect x="18" y="42.75" width="20.25" height="5.4" rx="2.7" fill="#0A0A0A"/>
    <!-- the agent eye scanning it -->
    <circle cx="50.6" cy="47.25" r="9" fill="#0A0A0A"/>
    <circle cx="50.6" cy="47.25" r="3.8" fill="#C6F24E"/>
  </g>
  <!-- wordmark -->
  <text x="136" y="78" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="48" font-weight="700" letter-spacing="-1">
    <tspan fill="#FAFAFA">AX</tspan><tspan fill="#C6F24E">ray</tspan>
  </text>
</svg>
